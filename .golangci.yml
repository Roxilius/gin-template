version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    generated: lax
    paths:
      - docs
    rules:
      - path: _test\.go
        linters: [gosec]
      # Tool development yang dijalankan developer sendiri: path/argumen berasal
      # dari flag miliknya, dan folder project memang dibuat 0755 seperti biasa.
      - path: scripts/initproject/
        linters: [gosec]
        text: "G204|G301|G304|G703"

formatters:
  enable:
    - gofmt
    - goimports
    - gci
  settings:
    gci:
      # Urutan import: standard library, pihak ketiga, lalu package project ini.
      # "localmodule" membaca nama module dari go.mod, jadi tidak perlu diganti
      # saat template disalin ke project baru.
      sections:
        - standard
        - default
        - localmodule

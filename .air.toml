# Hot reload untuk development: jalankan `air` (install: make tools).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  bin = "./tmp/main.exe"
  include_ext = ["go", "env"]
  exclude_dir = ["bin", "tmp", "docs", "migrations", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
